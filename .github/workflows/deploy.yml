name: Deploy to Server

on:
  push:
    branches: [ developer, main ]
  workflow_dispatch:  # позволяет запускать вручную

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Debug Secrets
      env:
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      run: |
        echo "STRIPE_SECRET_KEY длина: ${#STRIPE_SECRET_KEY}"
        echo "STRIPE_PUBLISHABLE_KEY длина: ${#STRIPE_PUBLISHABLE_KEY}"
        if [ -z "$STRIPE_SECRET_KEY" ]; then
          echo "❌ STRIPE_SECRET_KEY is empty!"
          exit 1
        else
          echo "✅ STRIPE_SECRET_KEY is set"
        fi
    
    - name: Run tests
      env:
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        python manage.py test

  deploy:
    needs: test
    if: success() && github.ref == 'refs/heads/developer'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/drl-project
          git pull origin developer
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
