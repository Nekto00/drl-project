version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: drl_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    env_file:
      - .env
    networks:
      - drl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для Celery
  redis:
    image: redis:7-alpine
    container_name: drl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drl_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django бэкенд
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drl_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONUNBUFFERED=1
    networks:
      - drl_network
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

  # Celery worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drl_celery
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=config.settings
    networks:
      - drl_network
    command: celery -A config worker --loglevel=info

  # Celery beat для периодических задач
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drl_celery_beat
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      celery:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=config.settings
    networks:
      - drl_network
    command: celery -A config beat --loglevel=info

networks:
  drl_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: